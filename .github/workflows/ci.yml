name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native dependency prerequisites
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: Install pinned package manager
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - name: Provide disposable runner build memory
        run: |
          sudo fallocate -l 12G /swapfile-cortex-ci
          sudo chmod 600 /swapfile-cortex-ci
          sudo mkswap /swapfile-cortex-ci
          sudo swapon /swapfile-cortex-ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: python3 installer/selfcheck.py
      - run: python3 tools/test-publication-audit.py
